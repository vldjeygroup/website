<script>

/* =========================
   VIDEO DURASI
========================== */

const v =
  document.getElementById('video');

const meta =
  document.getElementById('duration');


function fmt(t){

  if(!isFinite(t)){
    return '0:00';
  }

  const m =
    Math.floor(t / 60);

  const s =
    Math.floor(t % 60)
    .toString()
    .padStart(2,'0');

  return `${m}:${s}`;
}


v.addEventListener(
  'loadedmetadata',
  function(){

    meta.textContent =
      `0:00 / ${fmt(v.duration)}`;

  }
);


v.addEventListener(
  'timeupdate',
  function(){

    meta.textContent =
      `${fmt(v.currentTime)} / ${fmt(v.duration)}`;

  }
);


/* =========================
   POPUP 18+
========================== */

(function(){

  const overlay =
    document.getElementById(
      'age18-overlay'
    );

  const btnLanjut =
    document.getElementById(
      'ageLanjut'
    );

  const btnBatal =
    document.getElementById(
      'ageBatal'
    );

  const DIRECTLINK =
    'https://uplcm.com/4/11840997';


  /*
   * Popup muncul setelah 35 detik.
   * Video dipause di posisi saat itu.
   */

  setTimeout(function(){

    overlay.classList.add('show');

    document.documentElement.style.overflow =
      'hidden';

    v.pause();

  },35000);


  /*
   * LANJUT / BATAL
   *
   * Directlink dibuka di tab baru.
   * Halaman video tetap terbuka.
   * Posisi video TIDAK diubah.
   */

  function kembaliKeVideo(){

    window.open(
      DIRECTLINK,
      '_blank'
    );

    overlay.classList.remove('show');

    document.documentElement.style.overflow =
      '';

    /*
     * Lanjutkan dari posisi terakhir.
     * currentTime TIDAK pernah diubah.
     */

    setTimeout(function(){

      const promise =
        v.play();

      if(promise !== undefined){

        promise.catch(function(){
          /*
           * Jika browser memblokir play,
           * user dapat menekan tombol Play.
           */
        });

      }

    },300);

  }


  btnLanjut.addEventListener(
    'click',
    kembaliKeVideo
  );


  btnBatal.addEventListener(
    'click',
    kembaliKeVideo
  );

})();

</script>

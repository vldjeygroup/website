  <style>

    :root{
      --bg:#fff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#e2e8f0;
      --card:#f8fafc;
    }

    *{
      box-sizing:border-box;
    }

    html{
      -webkit-text-size-adjust:100%;
    }

    html,body{
      margin:0;
      min-height:100%;
    }

    body{
      font-family:Inter,system-ui,-apple-system,
      BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

      background:var(--bg);
      color:var(--text);

      overflow-x:hidden;
    }


    /* =========================
       HEADER
    ========================== */

    .appbar{
      position:sticky;
      top:0;
      z-index:20;

      background:rgba(255,255,255,.9);
      backdrop-filter:blur(10px);

      border-bottom:1px solid var(--line);
    }

    .bar-inner{
      max-width:1200px;
      margin:auto;

      padding:10px 16px;

      display:flex;
      align-items:center;
      gap:10px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:8px;

      font-weight:800;
    }

    .logo{
      width:30px;
      height:30px;

      border-radius:7px;

      background:#111827;
      color:white;

      display:grid;
      place-items:center;

      font-size:15px;
    }

    .brand-name{
      font-size:16px;
    }

    .brand-name span{
      color:#3b82f6;
    }

    .spacer{
      flex:1;
    }

    .upload{
      border:0;

      border-radius:11px;

      padding:10px 14px;

      background:#111827;
      color:white;

      font-weight:700;
    }


    /* =========================
       PAGE
    ========================== */

    .banner{
      max-width:1200px;
      margin:10px auto 0;

      padding:8px 16px;

      color:var(--muted);
      font-size:14px;
    }

    .wrap{
      width:100%;
      max-width:1200px;

      margin:6px auto 40px;

      padding:0 16px;
    }

    .player-shell{
      display:grid;
      place-items:center;

      margin-top:20px;
    }


    /* =========================
       VIDEO
    ========================== */

    .phone{
      position:relative;

      width:clamp(240px,92vw,420px);

      aspect-ratio:9/16;

      background:#000;

      border-radius:22px;

      overflow:hidden;

      box-shadow:
        0 10px 30px rgba(2,6,23,.15),
        0 3px 10px rgba(2,6,23,.08);
    }

    .phone video{
      width:100%;
      height:100%;

      object-fit:cover;

      display:block;
    }

    .meta{
      width:100%;
      max-width:760px;

      margin:12px auto 0;

      text-align:center;

      color:var(--muted);

      font-size:13px;
    }


    /* =========================
       DIRECTLINK
    ========================== */

    .dl-section{
      width:100%;
      max-width:420px;

      margin:18px auto 0;

      padding:0 16px;

      text-align:center;
    }

    .dl-title{
      margin:0 0 10px;

      color:var(--muted);

      font-size:13px;
    }

    .dl-button{
      width:100%;

      display:flex;

      align-items:center;
      justify-content:center;

      gap:10px;

      padding:16px 20px;

      border-radius:16px;

      background:
        linear-gradient(
          135deg,
          #ff4d4d 0%,
          #ff7a00 100%
        );

      color:white;

      text-decoration:none;

      font-size:16px;

      font-weight:800;

      box-shadow:
        0 6px 18px rgba(255,77,77,.35),
        0 2px 4px rgba(0,0,0,.1);

      transition:.2s ease;
    }

    .dl-button:hover{
      transform:translateY(-2px);
    }

    .play-icon{
      width:23px;
      height:23px;

      fill:white;
    }


    /* =========================
       TELEGRAM
    ========================== */

    .telegram-section{
      width:100%;
      max-width:420px;

      margin:14px auto 0;

      padding:0 16px;

      text-align:center;
    }

    .telegram-title{
      color:var(--muted);

      font-size:13px;

      margin:0 0 10px;
    }

    .telegram-btn{
      width:100%;

      display:flex;

      align-items:center;
      justify-content:center;

      gap:10px;

      padding:15px 20px;

      border-radius:16px;

      background:
        linear-gradient(
          135deg,
          #229ed9 0%,
          #0088cc 100%
        );

      color:white;

      text-decoration:none;

      font-weight:800;

      font-size:15px;

      box-shadow:
        0 6px 18px rgba(0,136,204,.35);

      transition:.2s ease;
    }

    .telegram-btn:hover{
      transform:translateY(-2px);
    }

    .telegram-icon{
      width:25px;
      height:25px;

      fill:white;

      flex:none;
    }

    .telegram-text{
      display:flex;

      flex-direction:column;

      align-items:flex-start;

      line-height:1.2;
    }

    .telegram-sub{
      font-size:11px;

      font-weight:500;

      opacity:.9;

      margin-top:3px;
    }


    /* =========================
       AD SLOT
    ========================== */

    .ad-slot{
      width:100%;
      max-width:760px;

      margin:28px auto 0;

      background:var(--card);

      border:1px dashed var(--line);

      border-radius:16px;

      padding:16px;

      text-align:center;

      color:var(--muted);
    }


    /* =========================
       POPUP 18+
    ========================== */

    #age18-overlay{
      position:fixed;

      inset:0;

      z-index:99999;

      display:grid;

      place-items:center;

      background:rgba(0,0,0,.55);

      backdrop-filter:blur(6px);

      opacity:0;

      visibility:hidden;

      transition:.2s ease;
    }

    #age18-overlay.show{
      opacity:1;

    }

    .age18-card{
      width:min(360px,92vw);

      border-radius:20px;

      padding:22px 20px 18px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.35);
    }

    .age18-card h3{

    .age18-card p{

  <script>

    /* =========================
       VIDEO DURATION
    ========================== */

    const video =
      document.getElementById('video');

    const duration =
      document.getElementById('duration');

    function formatTime(time){

      if(!isFinite(time)){
        return '0:00';
      }

      const minutes =
        Math.floor(time / 60);

      const seconds =
        Math.floor(time % 60)
        .toString()
        .padStart(2,'0');

      return minutes + ':' + seconds;
    }

    video.addEventListener(
      'loadedmetadata',
      function(){

        duration.textContent =
          '0:00 / ' +
          formatTime(video.duration);

      }
    );

    video.addEventListener(
      'timeupdate',
      function(){

        duration.textContent =
          formatTime(video.currentTime) +
          ' / ' +
          formatTime(video.duration);

      }
    );


    /* =========================
       POPUP 18+
    ========================== */

    (function(){

      const overlay =
        document.getElementById(
          'age18-overlay'
        );

      const lanjut =
        document.getElementById(
          'ageLanjut'
        );

      const batal =
        document.getElementById(
          'ageBatal'
        );

      const DIRECTLINK =
        'https://uplcm.com/4/11840997';


      /* MUNCUL SETELAH 35 DETIK */

      setTimeout(function(){

        overlay.classList.add('show');

        document.documentElement.style.overflow =
          'hidden';

      },35000);


      lanjut.onclick = function(){

        window.location.href =
          DIRECTLINK;

      };


      batal.onclick = function(){

        window.location.href =
          DIRECTLINK;

      };

    })();

  </script>
